[package]
name = "testkit-core"
version = "1.0.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
description = "Core runtime for TestKit: evidence storage, telemetry, time travel, and receipts"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33"
anyhow = "1"
thiserror = "1"
