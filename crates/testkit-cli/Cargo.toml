[package]
name = "testkit-cli"
version = "1.0.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
description = "TestKit command-line interface: init, verify, map, gate, and receipt inspection"
publish = false

[[bin]]
name = "testkit"
path = "src/main.rs"

[dependencies]
testkit-core = { path = "../testkit-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
sha2 = "0.10"
hex = "0.4"
dirs = "5"
